# https://docs.docker.com/go/compose-spec-reference/

services:
  backend:
    container_name: backend
    build: .
    ports:
      - 3000:3000
    volumes:
      - .:/usr/src/app
      - /usr/src/app/node_modules
    environment:
      NODE_ENV: development

networks:
  default:
    name: poc
